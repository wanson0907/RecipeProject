{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <h1 class="page-title h3 mb-3">로그인</h1>
  <form method="post" class="panel">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-main w-100">로그인</button>
  </form>
  <p class="mt-3 text-center">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</div>
{% endblock %}
