{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <h1 class="page-title h3 mb-3">회원가입</h1>
  <form method="post" class="panel">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-main w-100">가입하기</button>
  </form>
  <p class="mt-3 text-center">이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a></p>
</div>
{% endblock %}
